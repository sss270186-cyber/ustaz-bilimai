name: Verify learning platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run seed:check
      - run: npm test
      - run: npm run test:programs
      - run: npm run test:excel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:css
